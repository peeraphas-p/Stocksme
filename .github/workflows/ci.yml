name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # ทดสอบทั้งเวลา UTC และเวลาไทย เพราะการคำนวณวันที่/เวลาตลาด US อ่อนไหวกับ timezone
      - name: Test (UTC)
        run: npm test
        env:
          TZ: UTC
      - name: Test (Asia/Bangkok)
        run: npm test
        env:
          TZ: Asia/Bangkok

      - name: Build
        run: npm run build
        env:
          # ค่าแทนสำหรับ build เท่านั้น — ค่าจริงอยู่ใน Netlify
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
